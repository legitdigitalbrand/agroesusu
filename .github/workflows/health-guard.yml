name: Post-deploy health guard

# Launch guard born from the 2026-09-11 incident: code was deployed while the
# database migrations lagged behind (journal-posting fix unapplied) — deposits
# landed at Safe Haven but never posted to the ledger, so users saw ₦0
# balances with no visible error anywhere.
#
# Every push to main triggers a Vercel deploy; this workflow then polls
# /api/health until the new build is live and FAILS if:
#   - the deployed code reports the database migrations are behind (503), or
#   - the endpoint never comes up.
# Add Vercel as a required check on main to make "deploy outruns migrations"
# impossible to merge/land silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: health-guard
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Poll deployed /api/health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://agriqcap.vercel.app/api/health' }}
        run: |
          set -o pipefail
          for i in $(seq 1 12); do
            echo "Attempt $i/12: GET $HEALTH_URL"
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 20 "$HEALTH_URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✅ Healthy:"; cat /tmp/health.json; exit 0
            fi
            if [ "$CODE" = "503" ]; then
              echo "❌ DEGRADED — database is behind deployed code:"; cat /tmp/health.json
              echo ""
              echo "Fix: apply pending migrations (supabase db push), then re-run this check."
              exit 1
            fi
            sleep 30
          done
          echo "❌ /api/health never returned healthy (deploy may still be building — re-run if so)"
          exit 1
